<body>
<div class="page">
  <h1>scribe-loop 手書きの検証</h1>

  <h2>0. 入力の調査</h2>
  <ul class="menu">
    <li><a href="probe.html">ペン・指・手のひらの見分け</a></li>
  </ul>

  <h2>1. 白紙に書く</h2>
  <ul class="menu">
    <li><a href="pad.html?doc=blank-canvas&amp;content=blank&amp;layout=paged&amp;render=canvas">白紙（Canvas で描画）</a></li>
    <li><a href="pad.html?doc=blank-svg&amp;content=blank&amp;layout=paged&amp;render=svg">白紙（SVG で描画）</a></li>

  <h2>2. 文章の上に書く</h2>

  <ul class="menu">
    <li><a href="pad.html?doc=text-scroll&amp;content=text&amp;layout=scroll&amp;render=canvas">文章・スクロール</a></li>

  <ul class="menu">
    <li><a href="rating.html">5 段階の評価</a></li>

  <h2>この端末の環境</h2>
  <p class="note" id="sent">送信中…</p>
  <table class="kv" id="features"></table>
</div>
<script src="common.js"></script>
<script>
(function () {
  var f = SL.features();
  var table = document.getElementById("features");
  for (var key in f) {
    if (!Object.prototype.hasOwnProperty.call(f, key)) continue;
    var row = table.insertRow(-1);
    row.insertCell(0).appendChild(document.createTextNode(key));
    var v = f[key];
    row.insertCell(1).appendChild(document.createTextNode(v === true ? "○" : v === false ? "×" : String(v)));
  }
  SL.log("features", f);
  SL.flushLog();
  window.setTimeout(function () {
    SL.get("/api/health", function (err) {
      document.getElementById("sent").firstChild.nodeValue = err ? "サーバーに届きません（" + err.message + "）" : "サーバーに接続しています";
    });
  }, 300);
})();
</script>
</body>
</html>
