<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>scribe-loop 入力の調査</title>
<link rel="stylesheet" href="style.css">
<style>
  .probe {
    border: 3px solid #000;
    height: 170px;
    margin: 8px 0;
    padding: 8px;
    font-size: 18px;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .result { font-size: 14px; line-height: 1.4; font-family: monospace; white-space: pre-wrap; min-height: 2.8em; }
</style>
</head>
<body>
<div class="page">
  <h1>入力の調査</h1>
  <p class="note">それぞれの枠の中を、書いてあるとおりになぞってください。何度なぞってもかまいません。枠の下に、届いた値が出ます。</p>
  <div id="probes"></div>
  <p><a href="/">一覧に戻る</a></p>
</div>
<script src="common.js"></script>
<script>
(function () {
  var probes = [
    ["pen", "1. ペン先でなぞる"],
    ["pen-hard", "2. ペン先で強く押してなぞる"],
    ["pen-light", "3. ペン先で軽くなぞる"],
    ["eraser", "4. ペンの反対側（消しゴム端）でなぞる"],
    ["pen-button", "5. ペンのボタンを押しながらなぞる"],
    ["finger", "6. 指でなぞる"],
    ["palm", "7. 手のひらを置く（置いたまま数秒）"],
    ["palm-pen", "8. 手のひらを置いたまま、ペンでなぞる"],
    ["hover", "9. ペン先を画面から少し浮かせて動かす"]
  ];
  var root = document.getElementById("probes");

  function describe(e) {
    return {
      type: e.type, pointerType: e.pointerType, pointerId: e.pointerId, isPrimary: e.isPrimary,
      button: e.button, buttons: e.buttons, pressure: e.pressure, tiltX: e.tiltX, tiltY: e.tiltY,
      twist: e.twist, width: e.width, height: e.height, detail: e.detail
    };
  }

  function uniq(list) {
    var seen = {}, out = [];
    for (var i = 0; i < list.length; i += 1) {
      var k = String(list[i]);
      if (!seen[k]) { seen[k] = true; out.push(k); }
    }
    return out.slice(0, 8).join(",");
  }

  probes.forEach(function (p) {
    var box = document.createElement("div");
    box.className = "probe";
    box.appendChild(document.createTextNode(p[1]));
    var result = document.createElement("div");
    result.className = "result";
    root.appendChild(box);
    root.appendChild(result);

    var rec = null;
    function start() {
      rec = { label: p[0], downs: [], counts: {}, pointerTypes: [], ids: [], pressures: [], buttons: [], widths: [], heights: [], tilts: [], samples: 0, coalesced: 0, startedAt: SL.now() };
    }
    function add(e) {
      if (!rec) start();
      rec.counts[e.type] = (rec.counts[e.type] || 0) + 1;
      rec.pointerTypes.push(e.pointerType);
      rec.ids.push(e.pointerId);
      rec.pressures.push(Math.round(e.pressure * 100) / 100);
      rec.buttons.push(e.buttons);
      rec.widths.push(e.width);
      rec.heights.push(e.height);
      rec.tilts.push(e.tiltX + "/" + e.tiltY);
      if (e.type === "pointerdown" && rec.downs.length < 5) rec.downs.push(describe(e));
      if (e.type === "pointermove") {
        rec.samples += 1;
        if (e.getCoalescedEvents) {
          try { rec.coalesced += e.getCoalescedEvents().length; } catch (err) {}
        }
      }
    }
    function finish() {
      if (!rec) return;
      var summary = {
        label: rec.label,
        counts: rec.counts,
        pointerType: uniq(rec.pointerTypes),
        pointerId: uniq(rec.ids),
        pressure: uniq(rec.pressures),
        buttons: uniq(rec.buttons),
        width: uniq(rec.widths),
        height: uniq(rec.heights),
        tilt: uniq(rec.tilts),
        moves: rec.samples,
        coalesced: rec.coalesced,
        ms: SL.now() - rec.startedAt,
        downs: rec.downs
      };
      SL.log("probe", summary);
      SL.flushLog();
      result.textContent =
        "type=" + summary.pointerType + " id=" + summary.pointerId + " buttons=" + summary.buttons +
        "\npressure=" + summary.pressure + " w×h=" + summary.width + "×" + summary.height + " tilt=" + summary.tilt +
        "\nevents=" + JSON.stringify(summary.counts);
      rec = null;
    }
    var timer = null;
    function onEvent(e) {
      add(e);
      if (e.type === "pointerup" || e.type === "pointercancel" || e.type === "pointerleave") {
        // 複数の指（手のひら）がまとめて離れるのを待ってから集計する
        if (timer) window.clearTimeout(timer);
        timer = window.setTimeout(finish, 1200);
      }
      if (e.preventDefault) e.preventDefault();
    }
    ["pointerdown", "pointermove", "pointerup", "pointercancel", "pointerover", "pointerenter", "pointerleave", "pointerout"].forEach(function (type) {
      SL.on(box, type, onEvent);
    });
    // touch / mouse イベントが別に来るかも数える
    ["touchstart", "touchmove", "touchend", "mousedown", "mousemove", "mouseup"].forEach(function (type) {
      SL.on(box, type, function (e) {
        if (!rec) start();
        rec.counts[type] = (rec.counts[type] || 0) + 1;
        if (type === "touchstart" && e.touches) rec.counts.maxTouches = Math.max(rec.counts.maxTouches || 0, e.touches.length);
      });
    });
  });
})();
</script>
</body>
</html>
